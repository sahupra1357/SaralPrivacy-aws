{#- Action-checklist rows shared by both briefing emails. Items are approved briefing
    content (HTML allowed), inserted unescaped exactly as the TypeScript template did. -#}
{% for item in checklist %}
      <tr>
        <td style="padding:8px 0;vertical-align:top;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td style="width:22px;vertical-align:top;padding-top:2px;">
                <div style="width:18px;height:18px;background-color:#E07B39;border-radius:50%;text-align:center;line-height:18px;">
                  <span style="color:#fff;font-size:11px;font-weight:700;">✓</span>
                </div>
              </td>
              <td style="padding-left:8px;font-size:13px;color:#2D3748;line-height:1.5;">{{ item|safe }}</td>
            </tr>
          </table>
        </td>
      </tr>
{%- endfor %}
