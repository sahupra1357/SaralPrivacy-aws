<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f4ef;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1c2333;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f4ef;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td style="background:#0f2a44;padding:20px 28px;color:#ffffff;font-size:18px;font-weight:600;">SaralPrivacy</td></tr>
        <tr><td style="padding:28px;font-size:15px;line-height:1.6;">
          {% block body %}{{ body_html | safe }}{% endblock %}
        </td></tr>
        <tr><td style="padding:16px 28px;font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;">
          {% block footer %}SaralPrivacy · <a href="{{ site_url }}" style="color:#0f2a44;">{{ site_url }}</a>{% endblock %}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
