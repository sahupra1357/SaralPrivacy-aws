[project]
name = "app"
version = "0.1.0"
description = "SaralPrivacy backend — FastAPI, SQLModel, Postgres"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "sqlmodel>=0.0.22,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "bcrypt>=4.2,<6.0",
    "pyjwt>=2.8,<3.0",
    "pyotp>=2.9,<3.0",
    "cryptography>=43.0",
    "qrcode[pil]>=7.4,<9.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    "boto3>=1.35,<2.0",
    "anthropic>=0.40",
    "apscheduler>=3.10,<4.0",
    "playwright>=1.47",
    "tenacity>=8.2,<10.0",
    "python-multipart>=0.0.9,<1.0",
    "email-validator>=2.1,<3.0",
    "phonenumbers>=8.13,<10.0",
    "google-auth[requests]>=2.30,<3.0",
    "gspread>=6.0,<7.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2,<9.0",
    "pytest-mock>=3.14,<4.0",
    "freezegun>=1.5,<2.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "coverage>=7.6,<8.0",
    "boto3-stubs[s3]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]
plugins = ["pydantic.mypy"]

# Third-party libraries that ship without type information.
[[tool.mypy.overrides]]
module = ["qrcode.*", "apscheduler.*", "gspread.*", "google.oauth2.*", "google.auth.*"]
ignore_missing_imports = true

# google-auth's Credentials constructors are untyped.
[[tool.mypy.overrides]]
module = ["app.editorial.pipeline.roadmap", "app.api.routes.seo"]
disallow_untyped_calls = false

# SQLModel's Field() overloads do not list the sa_type + nullable/sa_column_kwargs
# combinations that work at runtime (sqlmodel issue #...); the models are exercised by
# the migrations and the test suite.
[[tool.mypy.overrides]]
module = ["app.models.*"]
disable_error_code = ["call-overload"]

# Tests: monkeypatch module attributes, recorder lambdas and small untyped helpers are
# normal here; keep the checks that catch real mistakes.
[[tool.mypy.overrides]]
module = ["app.tests.*"]
implicit_reexport = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["attr-defined", "func-returns-value", "type-arg", "no-any-return", "var-annotated"]

[tool.ruff]
target-version = "py312"
exclude = ["alembic"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001"]
ignore = ["E501", "B008", "W191", "B904"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
