# Local development additions (applied automatically by `docker compose`).
# `make up` (docker compose up -d --wait) starts everything below as well:
#   mailcatcher  local inbox for every email the app sends   http://localhost:1080
#   minio        S3-compatible storage for uploads            http://localhost:9001
# The backend creates the MinIO bucket on start (app/initial_data.py).
#   docker compose watch                      hot reload for backend + frontend

services:
  backend:
    restart: "no"
    pull_policy: build
    depends_on:
      minio:
        condition: service_healthy
      mailcatcher:
        condition: service_started
    command: bash -c "bash scripts/prestart.sh && fastapi run --reload app/main.py --port 8000"
    develop:
      watch:
        - path: ./backend/app
          action: sync
          target: /app/app
        - path: ./backend/pyproject.toml
          action: rebuild

  worker:
    restart: "no"
    pull_policy: build
    develop:
      watch:
        - path: ./backend/app
          action: sync+restart
          target: /app/app

  frontend:
    restart: "no"
    pull_policy: build
    develop:
      watch:
        - path: ./frontend
          action: rebuild
          ignore:
            - node_modules/
            - .next/
            - tests/

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  minio:
    image: quay.io/minio/minio:latest  # Docker Hub no longer publishes minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12


  playwright:
    profiles: ["playwright"]
    image: mcr.microsoft.com/playwright:v1.47.0-jammy
    working_dir: /work
    volumes:
      - ./frontend:/work
    environment:
      BASE_URL: http://frontend:3000
    depends_on:
      frontend:
        condition: service_healthy
    command: npx playwright test

volumes:
  minio-data:
